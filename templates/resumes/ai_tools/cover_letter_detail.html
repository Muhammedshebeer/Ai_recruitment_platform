{% extends "base.html" %}

{% block title %}Cover Letter{% endblock %}

{% block content %}

<section class="max-w-5xl mx-auto px-6 py-16">

    <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6 mb-10">
        <div>
            <span class="px-4 py-2 rounded-full bg-yellow-500/10 border border-yellow-500/30 text-yellow-300">
                AI Cover Letter
            </span>

            <h1 class="text-5xl font-black mt-8">{{ cover_letter.title }}</h1>

            <p class="text-gray-400 mt-4">{{ cover_letter.job.company_name }} • {{ cover_letter.created_at|date:"d M Y" }}</p>
        </div>

        <a href="{% url 'cover_letter_history' %}"
           class="px-6 py-3 rounded-xl border border-slate-600 hover:border-cyan-400 font-semibold">
            History
        </a>
    </div>

    <div class="glass rounded-3xl p-10">

        <div class="whitespace-pre-wrap text-gray-300 leading-8" id="coverLetterText">{{ cover_letter.content }}</div>

        <button onclick="copyCoverLetter()"
                class="mt-8 px-6 py-3 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 font-semibold">
            Copy Cover Letter
        </button>

    </div>

</section>

<script>
function copyCoverLetter() {
    const text = document.getElementById("coverLetterText").innerText;
    navigator.clipboard.writeText(text);
    alert("Cover letter copied.");
}
</script>

{% endblock %}
