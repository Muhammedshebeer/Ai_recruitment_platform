{% extends "base.html" %}

{% block title %}Generate Cover Letter{% endblock %}

{% block content %}

<section class="max-w-4xl mx-auto px-6 py-16">

    <div class="mb-10">
        <span class="px-4 py-2 rounded-full bg-yellow-500/10 border border-yellow-500/30 text-yellow-300">
            AI Cover Letter Generator
        </span>

        <h1 class="text-5xl font-black mt-8">Generate Cover Letter</h1>

        <p class="text-gray-400 mt-4">{{ job.title }} • {{ job.company_name }}</p>
    </div>

    <div class="glass rounded-3xl p-10">

        <form method="POST" class="space-y-6" onsubmit="showLoading()">
            {% csrf_token %}

            <div>
                <label class="block mb-3 text-sm text-gray-400">Select Resume</label>
                {{ form.resume }}
            </div>

            <button type="submit"
                    class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 font-bold text-lg">
                Generate Cover Letter
            </button>
        </form>

    </div>

</section>

{% endblock %}
