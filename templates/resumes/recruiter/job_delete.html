{% extends "base.html" %}

{% block title %}Delete Job{% endblock %}

{% block content %}

<section class="max-w-3xl mx-auto px-6 py-20">

    <div class="glass rounded-3xl p-10 text-center">

        <i class="fa-solid fa-triangle-exclamation text-6xl text-red-400"></i>

        <h1 class="text-4xl font-black mt-8">Delete Job Post?</h1>

        <p class="text-gray-400 mt-4">
            You are about to delete <strong>{{ job.title }}</strong>. This action cannot be undone.
        </p>

        <form method="POST" class="mt-10 flex gap-4 justify-center">
            {% csrf_token %}

            <a href="{% url 'recruiter_jobs' %}"
               class="px-6 py-3 rounded-xl border border-slate-600 hover:border-blue-500 transition">
                Cancel
            </a>

            <button type="submit"
                    class="px-6 py-3 rounded-xl bg-red-500 font-bold">
                Delete
            </button>
        </form>

    </div>

</section>

{% endblock %}
