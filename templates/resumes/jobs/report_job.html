{% extends "base.html" %}

{% block title %}Report Job{% endblock %}

{% block content %}

<section class="max-w-4xl mx-auto px-6 py-16">
    <div class="mb-10">
        <span class="px-4 py-2 rounded-full bg-red-500/10 border border-red-500/30 text-red-300">Report Job</span>
        <h1 class="text-5xl font-black mt-8">Report {{ job.title }}</h1>
        <p class="text-gray-400 mt-4">{{ job.company_name }}</p>
    </div>

    <div class="glass rounded-3xl p-10">
        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block mb-3 text-sm text-gray-400">Reason</label>
                {{ form.reason }}
            </div>

            <div>
                <label class="block mb-3 text-sm text-gray-400">Details</label>
                {{ form.details }}
            </div>

            <button type="submit" class="w-full py-4 rounded-xl bg-red-500 font-bold text-lg">
                Submit Report
            </button>
        </form>
    </div>
</section>

{% endblock %}
